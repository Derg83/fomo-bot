name: Wallet-Sammler

# Einmal am Tag: Gewinner-Coins suchen, Wallets sammeln und bewerten.
# Braucht das Secret HELIUS_API_KEY (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet-sammler
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - name: Wallets sammeln und bewerten
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python3 wallet_collector.py

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "fomo-bot"
          git config user.email "fomo-bot@users.noreply.github.com"
          # Ergebnis beiseitelegen, auf den neuesten Stand (der Bot pusht alle 10 Min.) setzen, wieder drauf
          mkdir -p /tmp/out
          for f in wallets.json wallet_pool.csv docs/wallets.html; do
            [ -f "$f" ] && mkdir -p "/tmp/out/$(dirname $f)" && cp "$f" "/tmp/out/$f"
          done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/out/. .
            git add wallets.json wallet_pool.csv docs/wallets.html 2>/dev/null || true
            git commit -q -m "Wallet-Sammler $(date -u +%d.%m.%H:%M) UTC" || exit 0
            if git push -q origin HEAD:main; then echo "gespeichert"; exit 0; fi
            sleep 20
          done
          echo "Push fehlgeschlagen" && exit 1
