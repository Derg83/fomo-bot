name: Fomo-Bot

# Ein Lauf macht ca. 5,5 Stunden lang JEDE MINUTE eine Runde (Kurse, Stops, Einstiege),
# der Trichter selbst läuft nur alle 20 Minuten. Gespeichert wird alle 10 Minuten.
# Am Ende startet der Lauf selbst den nächsten. Der Zeitplan unten ist nur Reserve.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fomo-bot
  cancel-in-progress: false

jobs:
  runde:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Runden jede Minute
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "fomo-bot"
          git config user.email "fomo-bot@users.noreply.github.com"
          save() {
            git add -A
            git commit -q -m "Bot-Runde $(date -u +%H:%M) UTC" || return 0
            # bei Konflikten gewinnt der lokale Bot-Stand; neue Code-Versionen kommen trotzdem mit
            if git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main; then
              return 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Speichern fehlgeschlagen, nächster Versuch in 10 Min."
          }
          git pull -q origin main || true
          ende=$(( $(date +%s) + 330 * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$ende" ]; do
            start=$(date +%s)
            i=$((i + 1))
            timeout 300 python3 fomo_bot.py once || echo "Runde $i mit Fehler"
            if [ $((i % 10)) -eq 0 ]; then save; fi
            wait=$(( 60 - ( $(date +%s) - start ) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
          save

      - name: Naechsten Lauf starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main

      # GitHubs Zeitplan ist unzuverlässig: die Neben-Abläufe werden von hier mit angestoßen
      - name: Neben-Ablaeufe anstossen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rueckblick.yml --ref main || true
          last=$(gh run list --workflow wallets.yml --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt 72000 ]; then
            gh workflow run wallets.yml --ref main || true
            gh workflow run rueckblick-wallets.yml --ref main || true
          fi
