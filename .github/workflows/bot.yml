name: Fomo-Bot

# Ein Lauf macht ca. 5,5 Stunden lang alle 10 Minuten eine Runde
# und startet am Ende selbst den naechsten Lauf. Der Zeitplan unten
# ist nur Reserve, falls die Kette mal abreisst.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fomo-bot
  cancel-in-progress: false

jobs:
  runde:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Runden alle 10 Minuten
        run: |
          git config user.name "fomo-bot"
          git config user.email "fomo-bot@users.noreply.github.com"
          for i in $(seq 1 33); do
            start=$(date +%s)
            git fetch -q origin main && git reset -q --hard origin/main
            python3 fomo_bot.py once || echo "Runde $i mit Fehler"
            git add -A
            if git commit -q -m "Bot-Runde $(date -u +%H:%M) UTC"; then
              if ! { git pull --rebase -q && git push -q; }; then
                echo "Push fehlgeschlagen, Runde verworfen"
                git rebase --abort 2>/dev/null || true
                git fetch -q origin main && git reset -q --hard origin/main
              fi
            fi
            if [ "$i" -lt 33 ]; then
              wait=$(( 600 - ( $(date +%s) - start ) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done

      - name: Naechsten Lauf starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
