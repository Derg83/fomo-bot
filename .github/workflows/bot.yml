name: Fomo-Bot

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub startet oft ein paar Minuten später)
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: fomo-bot
  cancel-in-progress: false

jobs:
  runde:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Bot-Runde
        run: python3 fomo_bot.py once

      - name: Stand speichern
        run: |
          git config user.name "fomo-bot"
          git config user.email "fomo-bot@users.noreply.github.com"
          git add -A
          git commit -m "Bot-Runde $(date -u +%H:%M) UTC" || exit 0
          git pull --rebase
          git push
