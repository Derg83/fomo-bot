name: Push-Test

# Auf Knopfdruck: schickt eine Test-Nachricht aufs Handy (prüft auch, ob das Secret NTFY_TOPIC eingetragen ist).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test-Nachricht senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 push_test.py
